<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Babyshop — Пользователи</title>
<link rel="stylesheet" href="../webapp/css/theme.css?v=2">
<style>
  .admin-header { display:flex; justify-content:space-between; align-items:center; padding: 20px 0; }
  .admin-nav-tabs { display:flex; gap:8px; margin-bottom: 16px; }
  .admin-nav-tabs a { padding: 8px 16px; border-radius: var(--radius-sm); font-size: 14px; color: var(--text-secondary); }
  .admin-nav-tabs a.active { background: var(--accent); color: var(--accent-text); }
  .admin-table { width:100%; border-collapse: collapse; }
  .admin-table th, .admin-table td { text-align:left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .admin-table th { color: var(--text-muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  .role-tag { font-size: 11px; padding: 3px 10px; border-radius: 10px; font-weight: 600; }
  .role-superuser { background: rgba(53,194,168,0.15); color: var(--accent); }
  .role-customer { background: var(--bg-elev); color: var(--text-muted); }
  .row-actions { display:flex; gap:8px; }
  .row-actions button { padding: 6px 10px; font-size: 12px; }
  .search-wrap { margin-bottom: 16px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--bg-card); border-radius: var(--radius-lg); padding: 24px; width: 480px; max-width: 100%; max-height: 90vh; overflow-y: auto; }
  .form-group { margin-bottom: 14px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>
<body>

<div class="container" style="max-width: 1000px;">
  <div class="admin-header">
    <h1 style="font-size:20px;font-weight:700;">Пользователи</h1>
    <button class="btn btn-primary" id="addUserBtn">+ Добавить пользователя</button>
  </div>
  <div class="admin-nav-tabs">
    <a href="dashboard.html">Товары</a>
    <a href="orders.html">Заказы</a>
    <a href="users.html" class="active">Пользователи</a>
  </div>

  <div class="search-wrap">
    <input class="input" id="searchInput" placeholder="Поиск по имени, телефону, аптеке, Telegram ID">
  </div>

  <div class="card" style="overflow-x:auto;">
    <table class="admin-table">
      <thead>
        <tr><th>ID</th><th>Имя</th><th>Телефон</th><th>Аптека</th><th>Telegram ID</th><th>Роль</th><th>Действия</th></tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h2 id="modalTitle" style="font-size:18px;margin:0 0 16px;">Добавить пользователя</h2>
    <form id="userForm">
      <input type="hidden" id="userId">
      <div class="form-row">
        <div class="form-group">
          <label class="label">Телефон (без +998)</label>
          <input class="input" id="phone" required placeholder="901234567">
        </div>
        <div class="form-group">
          <label class="label">Роль</label>
          <select class="input" id="role">
            <option value="customer">Клиент</option>
            <option value="superuser">Superuser (админ)</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="label" id="passwordLabel">Пароль</label>
        <input class="input" id="password" type="text" placeholder="Оставь пустым, чтобы не менять">
      </div>
      <div class="form-group">
        <label class="label">Имя получателя</label>
        <input class="input" id="recipientName">
      </div>
      <div class="form-group">
        <label class="label">Название аптеки</label>
        <input class="input" id="pharmacyName">
      </div>
      <div class="form-group">
        <label class="label">Контактное лицо</label>
        <input class="input" id="contactPerson">
      </div>
      <div class="form-group">
        <label class="label">Адрес</label>
        <input class="input" id="address">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="label">Город</label>
          <input class="input" id="city">
        </div>
        <div class="form-group">
          <label class="label">Район</label>
          <input class="input" id="district">
        </div>
      </div>
      <div class="form-group">
        <label class="label">Telegram ID (необязательно)</label>
        <input class="input" id="telegramId" placeholder="Например: 7121759205">
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="button" class="btn" style="flex:1" id="cancelBtn">Отмена</button>
        <button type="submit" class="btn btn-primary" style="flex:1">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<script src="js/admin-auth.js"></script>
<script>
  requireAdminAuth();

  let allUsers = [];

  async function loadUsers() {
    const res = await adminFetch('/admin/users');
    allUsers = await res.json();
    renderTable(allUsers);
  }

  function renderTable(users) {
    document.getElementById('usersBody').innerHTML = users.map(u => `
      <tr>
        <td>${u.id}</td>
        <td>${u.recipient_name || '—'}</td>
        <td>${u.phone}</td>
        <td>${u.pharmacy_name || '—'}</td>
        <td style="font-family:monospace; font-size:12px;">${u.telegram_id || '—'}</td>
        <td><span class="role-tag ${u.role === 'superuser' ? 'role-superuser' : 'role-customer'}">${u.role === 'superuser' ? 'Superuser' : 'Клиент'}</span></td>
        <td>
          <div class="row-actions">
            <button class="btn" onclick="editUser(${u.id})">Изменить</button>
            <button class="btn-danger" onclick="deleteUser(${u.id})">Удалить</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) return renderTable(allUsers);
    renderTable(allUsers.filter(u =>
      (u.recipient_name || '').toLowerCase().includes(q) ||
      (u.phone || '').toLowerCase().includes(q) ||
      (u.pharmacy_name || '').toLowerCase().includes(q) ||
      (u.telegram_id || '').toLowerCase().includes(q)
    ));
  });

  function openModal(title) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalOverlay').classList.add('open');
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('userForm').reset();
    document.getElementById('userId').value = '';
  }

  document.getElementById('addUserBtn').addEventListener('click', () => {
    document.getElementById('passwordLabel').textContent = 'Пароль';
    openModal('Добавить пользователя');
  });
  document.getElementById('cancelBtn').addEventListener('click', closeModal);

  window.editUser = function(id) {
    const u = allUsers.find(x => x.id === id);
    document.getElementById('userId').value = u.id;
    document.getElementById('phone').value = u.phone.replace(/^\+?998/, '');
    document.getElementById('role').value = u.role;
    document.getElementById('recipientName').value = u.recipient_name || '';
    document.getElementById('pharmacyName').value = u.pharmacy_name || '';
    document.getElementById('contactPerson').value = u.contact_person || '';
    document.getElementById('address').value = u.address || '';
    document.getElementById('city').value = u.city || '';
    document.getElementById('district').value = u.district || '';
    document.getElementById('telegramId').value = u.telegram_id || '';
    document.getElementById('passwordLabel').textContent = 'Новый пароль (оставь пустым, чтобы не менять)';
    openModal('Редактировать пользователя');
  };

  window.deleteUser = async function(id) {
    if (!confirm('Удалить пользователя? Это действие необратимо.')) return;
    await adminFetch('/admin/users/' + id, { method: 'DELETE' });
    loadUsers();
  };

  document.getElementById('userForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('userId').value;
    const payload = {
      phone: document.getElementById('phone').value,
      role: document.getElementById('role').value,
      recipient_name: document.getElementById('recipientName').value,
      pharmacy_name: document.getElementById('pharmacyName').value,
      contact_person: document.getElementById('contactPerson').value,
      address: document.getElementById('address').value,
      city: document.getElementById('city').value,
      district: document.getElementById('district').value,
      telegram_id: document.getElementById('telegramId').value || null,
    };
    const password = document.getElementById('password').value;

    try {
      let res;
      if (id) {
        if (password) payload.new_password = password;
        res = await adminFetch('/admin/users/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
      } else {
        if (!password) {
          alert('Пароль обязателен при создании нового пользователя');
          return;
        }
        payload.password = password;
        res = await adminFetch('/admin/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
      }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Ошибка сохранения');
      }
      closeModal();
      loadUsers();
    } catch (err) {
      alert('Ошибка: ' + err.message);
    }
  });

  loadUsers();
</script>
</body>
</html>
