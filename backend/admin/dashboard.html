<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Babyshop — Товары</title>
<link rel="stylesheet" href="../webapp/css/theme.css">
<style>
  .admin-header { display:flex; justify-content:space-between; align-items:center; padding: 20px 0; }
  .admin-nav-tabs { display:flex; gap:8px; margin-bottom: 16px; }
  .admin-nav-tabs a { padding: 8px 16px; border-radius: var(--radius-sm); font-size: 14px; color: var(--text-secondary); }
  .admin-nav-tabs a.active { background: var(--accent); color: var(--accent-text); }
  .admin-table { width:100%; border-collapse: collapse; }
  .admin-table th, .admin-table td { text-align:left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .admin-table th { color: var(--text-muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  .admin-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--bg-elev); }
  .row-actions { display:flex; gap:8px; }
  .row-actions button { padding: 6px 10px; font-size: 12px; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--bg-card); border-radius: var(--radius-lg); padding: 24px; width: 480px; max-width: 100%; max-height: 90vh; overflow-y: auto; }
  .form-group { margin-bottom: 14px; }
  textarea.input { min-height: 80px; resize: vertical; font-family: inherit; }
</style>
</head>
<body>

<div class="container" style="max-width: 900px;">
  <div class="admin-header">
    <h1 style="font-size:20px;font-weight:700;">Товары</h1>
    <button class="btn btn-primary" id="addProductBtn">+ Добавить товар</button>
  </div>
  <div class="admin-nav-tabs">
    <a href="dashboard.html" class="active">Товары</a>
    <a href="orders.html">Заказы</a>
    <a href="users.html">Пользователи</a>
  </div>

  <div class="card" style="overflow-x:auto;">
    <table class="admin-table">
      <thead>
        <tr><th>Фото</th><th>Название</th><th>Категория</th><th>Цена</th><th>Граммовка</th><th>Действия</th></tr>
      </thead>
      <tbody id="productsBody"></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h2 id="modalTitle" style="font-size:18px;margin:0 0 16px;">Добавить товар</h2>
    <form id="productForm">
      <input type="hidden" id="productId">
      <div class="form-group">
        <label class="label">Категория</label>
        <select class="input" id="categoryId"></select>
      </div>
      <div class="form-group">
        <label class="label">Название</label>
        <input class="input" id="name" required>
      </div>
      <div class="form-group">
        <label class="label">Описание</label>
        <textarea class="input" id="description"></textarea>
      </div>
      <div class="form-group">
        <label class="label">Граммовка / объём</label>
        <input class="input" id="weight">
      </div>
      <div class="form-group">
        <label class="label">Цена</label>
        <input class="input" id="price" placeholder="error404">
      </div>
      <div class="form-group">
        <label class="label">Фото товара</label>
        <input type="file" id="photo" accept="image/*">
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button type="button" class="btn" style="flex:1" id="cancelBtn">Отмена</button>
        <button type="submit" class="btn btn-primary" style="flex:1">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<script src="js/admin-auth.js"></script>
<script>
  requireAdminAuth();

  let categories = [];
  let products = [];

  async function loadCategories() {
    const res = await fetch(ADMIN_API_BASE + '/categories');
    categories = await res.json();
    document.getElementById('categoryId').innerHTML = categories.map(c => `<option value="${c.id}">${c.name_ru}</option>`).join('');
  }

  async function loadProducts() {
    const publicRes = await fetch(ADMIN_API_BASE + '/products');
    products = await publicRes.json();
    renderTable();
  }

  function renderTable() {
    const catName = (id) => categories.find(c => c.id === id)?.name_ru || '—';
    document.getElementById('productsBody').innerHTML = products.map(p => `
      <tr>
        <td>${p.photo_url ? `<img class="admin-thumb" src="${p.photo_url}">` : '<div class="admin-thumb"></div>'}</td>
        <td>${p.name}</td>
        <td>${catName(p.category_id)}</td>
        <td>${p.price}</td>
        <td>${p.weight || ''}</td>
        <td>
          <div class="row-actions">
            <button class="btn" onclick="editProduct(${p.id})">Изменить</button>
            <button class="btn-danger" onclick="deleteProduct(${p.id})">Удалить</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function openModal(title) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalOverlay').classList.add('open');
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('productForm').reset();
    document.getElementById('productId').value = '';
  }

  document.getElementById('addProductBtn').addEventListener('click', () => {
    openModal('Добавить товар');
  });
  document.getElementById('cancelBtn').addEventListener('click', closeModal);

  window.editProduct = function(id) {
    const p = products.find(x => x.id === id);
    document.getElementById('productId').value = p.id;
    document.getElementById('categoryId').value = p.category_id;
    document.getElementById('name').value = p.name;
    document.getElementById('description').value = p.description || '';
    document.getElementById('weight').value = p.weight || '';
    document.getElementById('price').value = p.price || '';
    openModal('Редактировать товар');
  };

  window.deleteProduct = async function(id) {
    if (!confirm('Удалить товар?')) return;
    await adminFetch('/admin/products/' + id, { method: 'DELETE' });
    loadProducts();
  };

  document.getElementById('productForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('productId').value;
    const formData = new FormData();
    formData.append('category_id', document.getElementById('categoryId').value);
    formData.append('name', document.getElementById('name').value);
    formData.append('description', document.getElementById('description').value);
    formData.append('weight', document.getElementById('weight').value);
    formData.append('price', document.getElementById('price').value || 'error404');
    const photoFile = document.getElementById('photo').files[0];
    if (photoFile) formData.append('photo', photoFile);

    const url = id ? '/admin/products/' + id : '/admin/products';
    const method = id ? 'PUT' : 'POST';

    await adminFetch(url, { method, body: formData });
    closeModal();
    loadProducts();
  });

  (async () => {
    await loadCategories();
    await loadProducts();
  })();
</script>
</body>
</html>
