<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Babyshop — Админ</title>
<link rel="stylesheet" href="../webapp/css/theme.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .admin-login-box { width: 340px; padding: 32px; }
  .admin-login-box h1 { font-size: 20px; margin: 0 0 20px; text-align:center; }
  .form-group { margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="card admin-login-box">
    <h1>Babyshop — Панель администратора</h1>
    <form id="loginForm">
      <div class="form-group">
        <label class="label">Логин</label>
        <input class="input" id="login" required autocomplete="off">
      </div>
      <div class="form-group">
        <label class="label">Пароль</label>
        <input class="input" id="password" type="password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Войти</button>
    </form>
  </div>

  <script src="js/admin-auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const login = document.getElementById('login').value;
      const password = document.getElementById('password').value;
      testAdminAuth(login, password);
    });
  </script>
</body>
</html>
