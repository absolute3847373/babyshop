<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Каталог — Babyshop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/theme.css?v=2">
<link rel="stylesheet" href="css/nav.css?v=2">
<link rel="stylesheet" href="css/catalog.css?v=2">
</head>
<body>

<div class="container page-transition">
  <div class="top-bar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input class="input" id="searchInput" placeholder="Поиск товара">
    </div>
    <div class="category-scroll" id="categoryScroll"></div>
  </div>

  <div class="product-grid" id="productGrid"></div>
  <div id="emptyState" class="empty-state" style="display:none;">—</div>
</div>

<script src="js/i18n.js?v=2"></script>
<script src="js/theme.js?v=2"></script>
<script src="js/api.js?v=2"></script>
<script src="js/nav.js?v=2"></script>
<script>
  initTheme();
  initTelegram();

  document.getElementById('searchInput').placeholder = t('search_placeholder');

  let categories = [];
  let activeCategory = null;
  let searchTimeout = null;

  const langKey = { ru: 'name_ru', uz: 'name_uz', en: 'name_en' }[getLang()] || 'name_ru';

  function renderIcon() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a4 4 0 018 0v2"/></svg>`;
  }

  function productCard(p) {
    const priceDisplay = p.price === 'error404'
      ? `<span class="product-price na">${t('price_unavailable')}</span>`
      : `<span class="product-price">${p.price}</span>`;

    const photo = p.photo_url
      ? `<img src="${p.photo_url}" alt="${p.name}">`
      : renderIcon();

    return `
      <div class="product-card" onclick="location.href='product.html?id=${p.id}'">
        <div class="product-photo">${photo}</div>
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-weight">${p.weight && p.weight !== 'не указано' ? p.weight : ''}</div>
          <div class="product-bottom">
            ${priceDisplay}
            <button class="add-btn" aria-label="${t('add_to_cart')}" onclick="event.stopPropagation(); quickAdd(${p.id})">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>
      </div>
    `;
  }

  async function quickAdd(id) {
    try {
      const p = await apiGet('/products/' + id);
      addToCart(p);
      document.querySelectorAll('.nav-badge').forEach(b => b.remove());
      mountBottomNav('catalog');
    } catch (e) { console.error(e); }
  }

  async function loadCategories() {
    categories = await apiGet('/categories');
    const scroll = document.getElementById('categoryScroll');
    scroll.innerHTML = `<div class="chip active" data-id="">${t('category_all')}</div>` +
      categories.map(c => `<div class="chip" data-id="${c.id}">${c[langKey] || c.name_ru}</div>`).join('');

    scroll.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        scroll.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        activeCategory = chip.dataset.id || null;
        loadProducts();
      });
    });
  }

  async function loadProducts() {
    const search = document.getElementById('searchInput').value.trim();
    const params = new URLSearchParams();
    if (activeCategory) params.set('category_id', activeCategory);
    if (search) params.set('search', search);

    const products = await apiGet('/products?' + params.toString());
    const grid = document.getElementById('productGrid');
    const empty = document.getElementById('emptyState');

    if (!products.length) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      empty.textContent = t('cart_empty') === 'Корзина пуста' ? 'Товары не найдены' : 'No products found';
      return;
    }
    empty.style.display = 'none';
    grid.innerHTML = products.map(productCard).join('');
  }

  document.getElementById('searchInput').addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(loadProducts, 300);
  });

  loadCategories();
  loadProducts();
  mountBottomNav('catalog');
</script>
</body>
</html>
