<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Корзина — Babyshop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/theme.css?v=2">
<link rel="stylesheet" href="css/nav.css?v=2">
<link rel="stylesheet" href="css/cart.css?v=2">
</head>
<body>

<div class="container page-transition">
  <h1 style="font-size:20px; font-weight:700; padding:16px 0 4px;" id="pageTitle">Корзина</h1>
  <div id="cartRoot"></div>
</div>

<script src="js/i18n.js?v=2"></script>
<script src="js/theme.js?v=2"></script>
<script src="js/api.js?v=2"></script>
<script src="js/nav.js?v=2"></script>
<script>
  initTheme();
  initTelegram();
  document.getElementById('pageTitle').textContent = t('nav_cart');

  function icon() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a4 4 0 018 0v2"/></svg>`;
  }

  function trashIcon() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>`;
  }

  function render() {
    const cart = getCart();
    const root = document.getElementById('cartRoot');

    if (!cart.length) {
      root.innerHTML = `<div class="empty-state" style="text-align:center;padding:60px 20px;color:var(--text-muted);">${t('cart_empty')}</div>`;
      return;
    }

    const hasRealPrice = cart.some(i => i.price !== 'error404');
    let total = 0;
    cart.forEach(i => {
      const num = parseFloat(String(i.price).replace(/[^\d.]/g, ''));
      if (!isNaN(num)) total += num * i.qty;
    });

    root.innerHTML = `
      <div class="stagger">
        ${cart.map(item => `
          <div class="card cart-item">
            <div class="cart-item-photo">${item.photo_url ? `<img src="${item.photo_url}">` : icon()}</div>
            <div class="cart-item-info">
              <p class="cart-item-name">${item.name}</p>
              <p class="cart-item-price">${item.price === 'error404' ? t('price_unavailable') : item.price}</p>
            </div>
            <div class="cart-item-qty">
              <button class="qty-btn-sm" onclick="changeQty(${item.id}, ${item.qty - 1})">−</button>
              <input
                class="qty-num-input"
                type="number"
                inputmode="numeric"
                min="1"
                value="${item.qty}"
                data-id="${item.id}"
                onfocus="this.select()"
                onchange="changeQty(${item.id}, parseInt(this.value) || 1)"
              >
              <button class="qty-btn-sm" onclick="changeQty(${item.id}, ${item.qty + 1})">+</button>
              <button class="remove-btn" onclick="removeItem(${item.id})">${trashIcon()}</button>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="card cart-summary">
        <div>
          <div class="cart-total-label">${t('cart_total')}</div>
          <div class="cart-total-value">${hasRealPrice ? total.toLocaleString() : t('price_unavailable')}</div>
        </div>
        <a href="checkout.html" class="btn btn-primary">${t('checkout')}</a>
      </div>
    `;
  }

  function changeQty(id, qty) {
    updateCartQty(id, qty);
    render();
    mountNavFresh();
  }

  function removeItem(id) {
    removeFromCart(id);
    render();
    mountNavFresh();
  }

  function mountNavFresh() {
    document.querySelector('.bottom-nav')?.remove();
    mountBottomNav('cart');
  }

  render();
  mountBottomNav('cart');
</script>
</body>
</html>
