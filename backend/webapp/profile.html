<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Профиль — Babyshop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/theme.css?v=2">
<link rel="stylesheet" href="css/nav.css?v=2">
<style>
  .profile-section { margin-bottom: 24px; }
  .section-label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; padding-left: 4px; }
  .option-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
  }
  .option-row:last-child { border-bottom: none; }
  .option-row.clickable { cursor: pointer; transition: background 0.15s var(--ease-smooth); }
  .option-row.clickable:active { background: var(--bg-elev); }
  .segmented { display: flex; background: var(--bg-elev); border-radius: var(--radius-sm); padding: 3px; gap: 3px; }
  .segmented button {
    border: none; background: transparent; padding: 6px 12px; border-radius: 6px;
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    transition: all 0.2s var(--ease-smooth);
  }
  .segmented button.active { background: var(--bg-card); color: var(--text-primary); box-shadow: var(--shadow-card); }

  .profile-header {
    display: flex; align-items: center; gap: 16px; padding: 20px; margin-bottom: 24px;
  }
  .avatar-wrap { position: relative; flex-shrink: 0; }
  .avatar-img {
    width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
    background: var(--brand-mint-100); display: flex; align-items: center; justify-content: center;
    color: var(--brand-teal-700); font-size: 26px; font-weight: 700;
  }
  [data-theme="dark"] .avatar-img { background: var(--brand-teal-700); color: var(--brand-mint-100); }
  .avatar-edit-btn {
    position: absolute; bottom: -2px; right: -2px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent); color: var(--accent-text); display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--bg); cursor: pointer;
  }
  .avatar-edit-btn svg { width: 13px; height: 13px; }
  .profile-name { font-size: 18px; font-weight: 700; margin: 0 0 2px; }
  .profile-phone { font-size: 13px; color: var(--text-muted); margin: 0; }

  .chevron { width: 18px; height: 18px; color: var(--text-muted); }

  .stats-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;
  }
  .stat-block { padding: 16px; }
  .stat-value { font-size: 22px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
  .stat-label { font-size: 12px; color: var(--text-secondary); }
  .stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

  .chart-card { padding: 16px; }
  .chart-title { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
</style>
</head>
<body>

<div class="container page-transition">
  <h1 style="font-size:20px; font-weight:700; padding:16px 0 4px;" id="pageTitle">Профиль</h1>

  <div id="notLoggedIn" style="display:none;">
    <div class="card fade-in" style="padding:20px; text-align:center; margin-top:16px;">
      <a href="auth.html?redirect=profile.html" class="btn btn-primary btn-block" id="loginLink">Вход</a>
    </div>
  </div>

  <div id="profileContent" style="display:none;">
    <div class="card profile-header fade-in">
      <div class="avatar-wrap">
        <div class="avatar-img" id="avatarImg"></div>
        <div class="avatar-edit-btn" id="avatarEditBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        </div>
        <input type="file" id="avatarInput" accept="image/*" style="display:none;">
      </div>
      <div>
        <p class="profile-name" id="profileName">—</p>
        <p class="profile-phone" id="profilePhone">—</p>
      </div>
    </div>

    <div class="profile-section" id="statsSection" style="display:none;">
      <div class="section-label">Статистика</div>
      <div class="stats-grid">
        <div class="card stat-block">
          <div class="stat-value" id="statMonthTotal">—</div>
          <div class="stat-label">Доход за месяц</div>
          <div class="stat-sub" id="statMonthCount">—</div>
        </div>
        <div class="card stat-block">
          <div class="stat-value" id="statAllTimeTotal">—</div>
          <div class="stat-label">Доход за всё время</div>
          <div class="stat-sub" id="statAllTimeCount">—</div>
        </div>
      </div>
      <div class="card chart-card">
        <div class="chart-title">Динамика по месяцам</div>
        <svg id="revenueChart" viewBox="0 0 320 120" style="width:100%; height:auto; display:block;"></svg>
      </div>
    </div>

    <div class="profile-section">
      <div class="section-label" id="lblLang">Язык</div>
      <div class="card">
        <div class="option-row">
          <span>Interface</span>
          <div class="segmented" id="langSwitch">
            <button data-lang="ru">RU</button>
            <button data-lang="uz">UZ</button>
            <button data-lang="en">EN</button>
          </div>
        </div>
      </div>
    </div>

    <div class="profile-section">
      <div class="section-label" id="lblTheme">Тема</div>
      <div class="card">
        <div class="option-row">
          <span id="themeLabelText">Оформление</span>
          <div class="segmented" id="themeSwitch">
            <button data-theme="light" id="lblLight">Светлая</button>
            <button data-theme="dark" id="lblDark">Тёмная</button>
          </div>
        </div>
      </div>
    </div>

    <div class="profile-section">
      <div class="card">
        <div class="option-row clickable" id="privacyLink">
          <div>
            <div id="privacyTitle" style="font-weight:500; margin-bottom:2px;">Настройки конфиденциальности</div>
            <div id="privacyDesc" style="font-size:12px; color:var(--text-muted);">Личные данные, адрес и контакты</div>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </div>
    </div>

    <div class="profile-section" id="userProfilesSection" style="display:none;">
      <div class="card">
        <div class="option-row clickable" id="userProfilesLink">
          <div>
            <div style="font-weight:500; margin-bottom:2px;">Профили пользователей</div>
            <div style="font-size:12px; color:var(--text-muted);">Список всех зарегистрированных клиентов</div>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/i18n.js?v=2"></script>
<script src="js/theme.js?v=2"></script>
<script src="js/api.js?v=2"></script>
<script src="js/nav.js?v=2"></script>
<script>
  initTheme();
  initTelegram();

  const user = getCurrentUser();

  function applyLabels() {
    document.getElementById('pageTitle').textContent = t('nav_profile');
    document.getElementById('loginLink').textContent = t('login');
    document.getElementById('lblLang').textContent = t('profile_lang');
    document.getElementById('lblTheme').textContent = t('profile_theme');
    document.getElementById('themeLabelText').textContent = t('profile_theme');
    document.getElementById('lblLight').textContent = t('theme_light');
    document.getElementById('lblDark').textContent = t('theme_dark');
    document.getElementById('privacyTitle').textContent = t('privacy_settings');
    document.getElementById('privacyDesc').textContent = t('privacy_settings_desc');
  }

  function updateLangUI() {
    document.querySelectorAll('#langSwitch button').forEach(b => b.classList.toggle('active', b.dataset.lang === getLang()));
  }
  function updateThemeUI() {
    document.querySelectorAll('#themeSwitch button').forEach(b => b.classList.toggle('active', b.dataset.theme === getTheme()));
  }

  document.querySelectorAll('#langSwitch button').forEach(btn => {
    btn.addEventListener('click', async () => {
      setLang(btn.dataset.lang);
      applyLabels();
      updateLangUI();
      mountNavFresh();
      if (user) {
        try { await apiPut('/users/' + user.id, { language: btn.dataset.lang }, { auth: true }); } catch (e) {}
      }
    });
  });

  document.querySelectorAll('#themeSwitch button').forEach(btn => {
    btn.addEventListener('click', async () => {
      applyTheme(btn.dataset.theme);
      updateThemeUI();
      if (user) {
        try { await apiPut('/users/' + user.id, { theme: btn.dataset.theme }, { auth: true }); } catch (e) {}
      }
    });
  });

  function mountNavFresh() {
    document.querySelector('.bottom-nav')?.remove();
    mountBottomNav('profile');
  }

  document.getElementById('privacyLink').addEventListener('click', () => {
    location.href = 'privacy-settings.html';
  });

  document.getElementById('userProfilesLink').addEventListener('click', () => {
    location.href = 'user-profiles.html';
  });

  if (user && user.role === 'superuser') {
    document.getElementById('userProfilesSection').style.display = 'block';
  }

  function renderAvatar() {
    const avatarEl = document.getElementById('avatarImg');
    if (user.avatar_url) {
      avatarEl.innerHTML = `<img src="${user.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
    } else {
      const name = user.recipient_name || user.phone || '?';
      avatarEl.textContent = name.trim().charAt(0).toUpperCase();
    }
  }

  if (!user) {
    document.getElementById('notLoggedIn').style.display = 'block';
  } else {
    document.getElementById('profileContent').style.display = 'block';
    document.getElementById('profileName').textContent = user.recipient_name || user.pharmacy_name || user.phone;
    document.getElementById('profilePhone').textContent = user.phone;
    renderAvatar();

    document.getElementById('avatarEditBtn').addEventListener('click', () => {
      document.getElementById('avatarInput').click();
    });

    document.getElementById('avatarInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const formData = new FormData();
      formData.append('avatar', file);
      try {
        const updated = await apiPutForm('/users/' + user.id, formData);
        setCurrentUser(updated);
        location.reload();
      } catch (err) {
        alert(err.message);
      }
    });

    if (user.role === 'superuser') {
      loadRevenueStats();
    }
  }

  function formatMoney(n) {
    return Math.round(n).toLocaleString('ru-RU');
  }

  function renderChart(series) {
    const svg = document.getElementById('revenueChart');
    const max = Math.max(...series.map(s => s.total), 1);
    const width = 320, height = 120, padding = 8;
    const stepX = (width - padding * 2) / (series.length - 1);

    const points = series.map((s, i) => {
      const x = padding + i * stepX;
      const y = height - padding - (s.total / max) * (height - padding * 2);
      return `${x},${y}`;
    }).join(' ');

    const accentColor = getTheme() === 'dark' ? '#35c2a8' : '#1d6e73';
    const fillId = 'chartFill';

    svg.innerHTML = `
      <defs>
        <linearGradient id="${fillId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${accentColor}" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="${accentColor}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <polyline points="${points}" fill="none" stroke="${accentColor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <polygon points="${padding},${height - padding} ${points} ${width - padding},${height - padding}" fill="url(#${fillId})"/>
    `;
  }

  async function loadRevenueStats() {
    try {
      const stats = await apiGet('/stats/revenue', { auth: true });
      document.getElementById('statsSection').style.display = 'block';
      document.getElementById('statMonthTotal').textContent = formatMoney(stats.total_this_month);
      document.getElementById('statMonthCount').textContent = `${stats.orders_count_this_month} заказ(ов)`;
      document.getElementById('statAllTimeTotal').textContent = formatMoney(stats.total_all_time);
      document.getElementById('statAllTimeCount').textContent = `${stats.orders_count_all_time} заказ(ов) всего`;
      renderChart(stats.monthly_series);
    } catch (err) {
      console.error('Failed to load revenue stats:', err.message);
    }
  }

  applyLabels();
  updateLangUI();
  updateThemeUI();
  mountBottomNav('profile');
</script>
</body>
</html>
