<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Профили пользователей — Babyshop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/theme.css?v=2">
<link rel="stylesheet" href="css/nav.css?v=2">
<style>
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 16px 0 8px;
    color: var(--text-secondary); font-size: 14px; font-weight: 500;
  }
  .back-btn svg { width: 18px; height: 18px; }

  .user-card {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 10px;
  }
  .user-avatar {
    width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    background: var(--brand-mint-100); color: var(--brand-teal-700);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px;
  }
  [data-theme="dark"] .user-avatar { background: var(--brand-teal-700); color: var(--brand-mint-100); }
  .user-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .user-sub { font-size: 12px; color: var(--text-secondary); margin: 0; }
  .user-tg-id { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-family: monospace; }

  .role-badge {
    font-size: 11px; padding: 3px 10px; border-radius: 10px; font-weight: 600; flex-shrink: 0;
  }
  .role-superuser { background: rgba(53,194,168,0.15); color: var(--accent); }
  .role-customer { background: var(--bg-elev); color: var(--text-muted); }

  .search-wrap { margin: 8px 0 16px; position: relative; }
  .search-wrap svg { position: absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--text-muted); }
  .search-wrap .input { padding-left: 40px; }
</style>
</head>
<body>

<div class="container page-transition">
  <a href="profile.html" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <span>Профиль</span>
  </a>

  <h1 style="font-size:20px; font-weight:700; padding:8px 0 4px;">Профили пользователей</h1>
  <p style="font-size:13px; color:var(--text-muted); margin:0 0 16px;" id="countLabel"></p>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input class="input" id="searchInput" placeholder="Поиск по имени, телефону, аптеке">
  </div>

  <div id="usersRoot"></div>
</div>

<script src="js/i18n.js?v=2"></script>
<script src="js/theme.js?v=2"></script>
<script src="js/api.js?v=2"></script>
<script src="js/nav.js?v=2"></script>
<script>
  initTheme();
  initTelegram();

  const currentUser = getCurrentUser();
  if (!currentUser || currentUser.role !== 'superuser') {
    location.href = 'profile.html';
  }

  let allUsers = [];

  function renderAvatar(u) {
    if (u.avatar_url) return `<div class="user-avatar"><img src="${u.avatar_url}"></div>`;
    const initial = (u.recipient_name || u.phone || '?').trim().charAt(0).toUpperCase();
    return `<div class="user-avatar">${initial}</div>`;
  }

  function renderUsers(users) {
    const root = document.getElementById('usersRoot');
    document.getElementById('countLabel').textContent = `Всего: ${users.length}`;

    if (!users.length) {
      root.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--text-muted);">Никого не найдено</div>`;
      return;
    }

    root.innerHTML = users.map(u => `
      <div class="card user-card fade-in">
        ${renderAvatar(u)}
        <div class="user-info">
          <p class="user-name">${u.recipient_name || u.pharmacy_name || u.phone}</p>
          <p class="user-sub">${u.phone} · ${u.pharmacy_name || '—'}</p>
          <p class="user-tg-id">Telegram ID: ${u.telegram_id || '—'}</p>
        </div>
        <span class="role-badge ${u.role === 'superuser' ? 'role-superuser' : 'role-customer'}">
          ${u.role === 'superuser' ? 'Админ' : 'Клиент'}
        </span>
      </div>
    `).join('');
  }

  async function load() {
    try {
      allUsers = await apiGet('/users/all', { auth: true });
      renderUsers(allUsers);
    } catch (err) {
      document.getElementById('usersRoot').innerHTML = `<div style="text-align:center;padding:40px;color:var(--danger);">${err.message}</div>`;
    }
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) return renderUsers(allUsers);
    const filtered = allUsers.filter(u =>
      (u.recipient_name || '').toLowerCase().includes(q) ||
      (u.phone || '').toLowerCase().includes(q) ||
      (u.pharmacy_name || '').toLowerCase().includes(q)
    );
    renderUsers(filtered);
  });

  load();
</script>
</body>
</html>
