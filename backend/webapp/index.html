<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Babyshop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/theme.css?v=2">
<link rel="stylesheet" href="css/nav.css?v=2">
<link rel="stylesheet" href="css/home.css?v=2">
</head>
<body>

<div class="container page-transition">
  <div class="hero">
    <div class="hero-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12l1.5-6h15L21 12M3 12v7h18v-7M3 12h18"/>
        <circle cx="7.5" cy="19" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="16.5" cy="19" r="1.4" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div>
      <h1 class="hero-title" id="appName">Babyshop</h1>
      <p class="hero-tagline" id="tagline">Товары для аптек — быстро и удобно</p>
      <div class="hero-cta">
        <a href="catalog.html" class="btn btn-primary" id="openCatalogBtn">Открыть каталог</a>
      </div>
    </div>
  </div>

  <div class="quick-stats stagger">
    <div class="card stat-card">
      <div class="stat-num">80+</div>
      <div class="stat-label" id="statProducts">товаров</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num">24/7</div>
      <div class="stat-label" id="statAvail">приём заказов</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num">1</div>
      <div class="stat-label" id="statDay">день на доставку</div>
    </div>
  </div>

  <div class="card contact-card fade-in">
    <div class="contact-avatar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 12a4 4 0 100-8 4 4 0 000 8z M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
    </div>
    <div class="contact-info">
      <p class="contact-name" id="contactTitle">Связь с нами</p>
      <p class="contact-sub">@Babyshop0070 · +998 93 231 00 70</p>
    </div>
  </div>
  <div class="contact-actions">
    <a href="https://t.me/Babyshop0070" class="btn" style="flex:1" target="_blank">Telegram</a>
    <a href="tel:+998932310070" class="btn" style="flex:1">Позвонить</a>
  </div>
</div>

<script src="js/i18n.js?v=2"></script>
<script src="js/theme.js?v=2"></script>
<script src="js/api.js?v=2"></script>
<script src="js/nav.js?v=2"></script>
<script>
  initTheme();
  initTelegram();

  document.getElementById('appName').textContent = t('app_name');
  document.getElementById('tagline').textContent = t('tagline');
  document.getElementById('openCatalogBtn').textContent = t('open_catalog');
  document.getElementById('contactTitle').textContent = t('contact_us');

  mountBottomNav('home');
</script>
</body>
</html>
