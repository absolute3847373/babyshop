<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Товар — Babyshop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/theme.css?v=2">
<link rel="stylesheet" href="css/nav.css?v=2">
<link rel="stylesheet" href="css/product.css?v=2">
</head>
<body>

<div class="container page-transition">
  <a href="catalog.html" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <span id="backLabel">Каталог</span>
  </a>

  <div class="product-detail-layout" id="productRoot"></div>
</div>

<script src="js/i18n.js?v=2"></script>
<script src="js/theme.js?v=2"></script>
<script src="js/api.js?v=2"></script>
<script src="js/nav.js?v=2"></script>
<script>
  initTheme();
  initTelegram();
  document.getElementById('backLabel').textContent = t('nav_catalog');

  const params = new URLSearchParams(location.search);
  const productId = params.get('id');
  let currentQty = 1;
  let product = null;

  function icon() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a4 4 0 018 0v2"/></svg>`;
  }

  function render() {
    const priceHtml = product.price === 'error404'
      ? `<p class="product-detail-price na">${t('price_unavailable')}</p>`
      : `<p class="product-detail-price">${product.price}</p>`;

    document.getElementById('productRoot').innerHTML = `
      <div class="product-hero-photo fade-in">
        ${product.photo_url ? `<img src="${product.photo_url}" alt="${product.name}">` : icon()}
      </div>
      <div class="product-detail-body fade-in">
        <h1 class="product-detail-name">${product.name}</h1>
        <p class="product-detail-weight">${product.weight && product.weight !== 'не указано' ? product.weight : ''}</p>
        ${priceHtml}
        <p class="product-detail-desc">${product.description || ''}</p>
        <div class="qty-row">
          <button class="qty-btn" id="qtyMinus">−</button>
          <span class="qty-value" id="qtyVal">1</span>
          <button class="qty-btn" id="qtyPlus">+</button>
        </div>
        <button class="btn btn-primary btn-block" id="addBtn">${t('add_to_cart')}</button>
      </div>
    `;

    document.getElementById('qtyMinus').onclick = () => { if (currentQty > 1) currentQty--; document.getElementById('qtyVal').textContent = currentQty; };
    document.getElementById('qtyPlus').onclick = () => { currentQty++; document.getElementById('qtyVal').textContent = currentQty; };
    document.getElementById('addBtn').onclick = () => {
      for (let i = 0; i < currentQty; i++) addToCart(product);
      location.href = 'cart.html';
    };
  }

  async function load() {
    product = await apiGet('/products/' + productId);
    render();
  }

  load();
  mountBottomNav('catalog');
</script>
</body>
</html>
