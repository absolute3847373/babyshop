<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вход — Babyshop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/theme.css?v=2">
<style>
  .auth-wrap { max-width: 400px; margin: 24px auto 0; }
  .form-group { margin-bottom: 14px; }
  .switch-link { text-align: center; margin-top: 16px; font-size: 14px; color: var(--accent); cursor: pointer; }
  .extra-fields { display: none; }
  .required-mark { color: var(--danger); }

  .lang-switch-top {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 20px;
  }
  .lang-switch-top button {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    transition: all 0.2s var(--ease-smooth);
  }
  .lang-switch-top button.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: transparent;
  }

  .terms-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 18px 0;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.4;
  }
  .terms-row input[type="checkbox"] {
    margin-top: 2px;
    width: 18px; height: 18px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  .terms-row a { color: var(--accent); text-decoration: underline; cursor: pointer; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal-overlay.open { display: flex; animation: fadeIn 0.25s var(--ease-smooth) both; }
  .modal-box {
    background: var(--bg-card); border-radius: var(--radius-lg); padding: 24px;
    width: 520px; max-width: 100%; max-height: 80vh; overflow-y: auto;
    animation: fadeIn 0.3s var(--ease-smooth) both;
  }
  .modal-box h2 { margin: 0 0 16px; font-size: 18px; }
  .modal-box pre {
    white-space: pre-wrap; font-family: inherit; font-size: 13px; line-height: 1.6;
    color: var(--text-secondary); margin: 0 0 20px;
  }

  .success-box { text-align: center; padding: 32px 20px; }
  .success-icon {
    width: 64px; height: 64px; border-radius: 50%; background: var(--success);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
    animation: fadeIn 0.4s var(--ease-smooth) both;
  }
  .success-icon svg { width: 32px; height: 32px; color: white; }
</style>
</head>
<body>

<div class="container">
  <div class="auth-wrap page-transition">

    <div class="lang-switch-top" id="langSwitchTop">
      <button data-lang="ru">RU</button>
      <button data-lang="uz">UZ</button>
      <button data-lang="en">EN</button>
    </div>

    <h1 style="font-size:22px; font-weight:700; text-align:center; margin-bottom:24px;" id="formTitle">Вход</h1>

    <form id="authForm">
      <div class="form-group">
        <label class="label" id="lblPhone">Номер телефона <span class="required-mark">*</span></label>
        <div style="display:flex; gap:8px;">
          <span class="input" style="flex:0 0 auto; width:64px; text-align:center; background:var(--bg-elev); color:var(--text-secondary); display:flex; align-items:center; justify-content:center;">+998</span>
          <input class="input" id="phone" type="tel" inputmode="numeric" required placeholder="90 123 45 67" style="flex:1;">
        </div>
      </div>
      <div class="form-group">
        <label class="label" id="lblPassword">Пароль <span class="required-mark">*</span></label>
        <input class="input" id="password" type="password" required>
      </div>

      <div class="extra-fields" id="extraFields">
        <div class="form-group">
          <label class="label" id="lblRecipient">Имя получателя <span class="required-mark">*</span></label>
          <input class="input" id="recipientName" required>
        </div>
        <div class="form-group">
          <label class="label" id="lblPharmacy">Название аптеки <span class="required-mark">*</span></label>
          <input class="input" id="pharmacyName" required>
        </div>
        <div class="form-group">
          <label class="label" id="lblContact">Контактное лицо <span class="required-mark">*</span></label>
          <input class="input" id="contactPerson" required>
        </div>
        <div class="form-group">
          <label class="label" id="lblAddress">Адрес аптеки <span class="required-mark">*</span></label>
          <input class="input" id="address" required>
        </div>
        <div class="form-group">
          <label class="label" id="lblCity">Город <span class="required-mark">*</span></label>
          <input class="input" id="city" required>
        </div>
        <div class="form-group">
          <label class="label" id="lblDistrict">Район <span class="required-mark">*</span></label>
          <input class="input" id="district" required>
        </div>

        <div class="terms-row">
          <input type="checkbox" id="termsCheckbox">
          <label for="termsCheckbox">
            <span id="termsCheckboxText">Я ознакомлен(а) и согласен(а) с</span>
            <a id="termsLink">условиями использования сервиса</a>
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn" style="margin-top:8px;">Продолжить</button>
    </form>

    <p class="switch-link" id="switchLink">Нет аккаунта? Зарегистрироваться</p>
  </div>
</div>

<div class="modal-overlay" id="termsModal">
  <div class="modal-box">
    <h2 id="termsModalTitle">Условия использования сервиса</h2>
    <pre id="termsModalText"></pre>
    <button class="btn btn-primary btn-block" id="termsCloseBtn">Закрыть</button>
  </div>
</div>

<div class="modal-overlay" id="successModal">
  <div class="modal-box success-box">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h2 id="successTitle" style="margin-bottom:8px;">Регистрация завершена</h2>
    <p id="successText" style="color:var(--text-secondary); margin-bottom:24px;">Аккаунт создан. Добро пожаловать в Babyshop!</p>
    <button class="btn btn-primary btn-block" id="successContinueBtn">Продолжить</button>
  </div>
</div>

<script src="js/i18n.js?v=2"></script>
<script src="js/theme.js?v=2"></script>
<script src="js/api.js?v=2"></script>
<script src="js/terms.js?v=2"></script>
<script>
  initTheme();
  initTelegram();

  let mode = 'login';
  const params = new URLSearchParams(location.search);
  const redirect = params.get('redirect') || 'index.html';

  function applyLabels() {
    document.getElementById('formTitle').textContent = mode === 'login' ? t('login') : t('register');
    document.getElementById('lblPhone').innerHTML = t('phone') + ' <span class="required-mark">*</span>';
    document.getElementById('lblPassword').innerHTML = t('password') + ' <span class="required-mark">*</span>';
    document.getElementById('lblRecipient').innerHTML = t('recipient_name') + ' <span class="required-mark">*</span>';
    document.getElementById('lblPharmacy').innerHTML = t('order_pharmacy') + ' <span class="required-mark">*</span>';
    document.getElementById('lblContact').innerHTML = t('order_contact') + ' <span class="required-mark">*</span>';
    document.getElementById('lblAddress').innerHTML = t('order_address') + ' <span class="required-mark">*</span>';
    document.getElementById('lblCity').innerHTML = t('city') + ' <span class="required-mark">*</span>';
    document.getElementById('lblDistrict').innerHTML = t('district') + ' <span class="required-mark">*</span>';
    document.getElementById('submitBtn').textContent = t('submit');
    document.getElementById('switchLink').textContent = mode === 'login' ? t('no_account') : t('already_have_account');
    document.getElementById('extraFields').style.display = mode === 'register' ? 'block' : 'none';
    document.getElementById('termsCheckboxText').textContent = t('terms_checkbox');
    document.getElementById('termsLink').textContent = t('terms_link_text');
    document.getElementById('termsModalTitle').textContent = t('terms_title');
    document.getElementById('termsCloseBtn').textContent = t('close');
    document.getElementById('successTitle').textContent = t('register_success_title');
    document.getElementById('successText').textContent = t('register_success_text');
    document.getElementById('successContinueBtn').textContent = t('submit');
    updateLangUI();
  }

  function updateLangUI() {
    document.querySelectorAll('#langSwitchTop button').forEach(b => b.classList.toggle('active', b.dataset.lang === getLang()));
  }

  document.querySelectorAll('#langSwitchTop button').forEach(btn => {
    btn.addEventListener('click', () => {
      setLang(btn.dataset.lang);
      applyLabels();
    });
  });

  document.getElementById('switchLink').addEventListener('click', () => {
    mode = mode === 'login' ? 'register' : 'login';
    applyLabels();
  });

  document.getElementById('termsLink').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('termsModalText').textContent = getTermsText();
    document.getElementById('termsModal').classList.add('open');
  });
  document.getElementById('termsCloseBtn').addEventListener('click', () => {
    document.getElementById('termsModal').classList.remove('open');
  });

  document.getElementById('successContinueBtn').addEventListener('click', () => {
    location.href = redirect;
  });

  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const phone = '998' + document.getElementById('phone').value.trim().replace(/[^\d]/g, '');
    const password = document.getElementById('password').value;
    const telegram_id = getTelegramId();

    try {
      let user;
      if (mode === 'login') {
        user = await apiPost('/login', { phone, password, telegram_id });
        setCurrentUser(user);
        location.href = redirect;
      } else {
        if (!document.getElementById('termsCheckbox').checked) {
          alert(t('terms_required_error'));
          return;
        }
        const payload = {
          phone, password, telegram_id,
          recipient_name: document.getElementById('recipientName').value.trim(),
          pharmacy_name: document.getElementById('pharmacyName').value.trim(),
          contact_person: document.getElementById('contactPerson').value.trim(),
          address: document.getElementById('address').value.trim(),
          city: document.getElementById('city').value.trim(),
          district: document.getElementById('district').value.trim(),
          language: getLang(),
          terms_accepted: true,
        };
        const created = await apiPost('/register', payload);
        user = { id: created.id, phone, telegram_id, role: created.role, ...payload };
        setCurrentUser(user);
        document.getElementById('successModal').classList.add('open');
      }
    } catch (err) {
      if (err.message === 'missing_required_fields') {
        alert(t('all_fields_required'));
      } else if (err.message === 'terms_not_accepted') {
        alert(t('terms_required_error'));
      } else {
        alert(err.message === 'invalid_credentials' ? 'Неверный телефон или пароль' :
              err.message === 'phone_already_registered' ? 'Этот номер уже зарегистрирован' :
              err.message);
      }
    }
  });

  applyLabels();
</script>
</body>
</html>
